                });
                const tel = createEl('a', {
                    class: 'btn btn-ghost', href: 'tel:' + phone,
                    text: '📞 ' + phone
                });
                const resumeLink = createEl('a', {
                    class: 'btn btn-ghost', href: '#highlights',
                    text: '↓ 进入简历'
                });
                cta.appendChild(mail);
                cta.appendChild(tel);
                cta.appendChild(resumeLink);

                col3.appendChild(cta);
                info.appendChild(col3);

                stage.appendChild(info);

                /* 滚动提示（流式，置于介绍区下方） */
                const scrollHint = createEl('div', { class: 'hero-scroll' });
                scrollHint.innerHTML = '<span class="bar"></span><span>SCROLL · 向下滚动查看完整简历</span>';
                stage.appendChild(scrollHint);

                // 触发入场动画：标题先出，介绍区紧随其后淡入
                requestAnimationFrame(() => {
                    title.classList.add('is-in');
                    setTimeout(() => info.classList.add('is-in'), 450);
                });

                // 时钟实时更新
                setInterval(() => {
                    const el = document.getElementById('heroClock');
                    if (el) el.textContent = clockFmt() + ' · CST';
                }, 1000);

                // 鼠标交互系统（云朵视差 / 标题 3D 倾斜 / 光晕跟随 / 字符响应 / 点击涟漪）
                initHeroInteraction();
            }

            function splitChars(str) {
                return Array.from(str);
            }

            function pad2(n) { return n < 10 ? '0' + n : '' + n; }
            function clockFmt() {
                const d = new Date();
                return d.getFullYear() + '.' + pad2(d.getMonth() + 1) + '.' + pad2(d.getDate()) +
                       ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds());
            }

            /* ========== Hero 鼠标交互系统 ==========
               一个 rAF 循环统一驱动：
               1) 云朵按 data-depth 反向视差（近快远慢）
               2) 标题 3D 倾斜 rotateX/rotateY（镂空层因 translateZ 产生立体错位）
               3) 光晕层跟随光标（暖橙跟随 + 天蓝对侧反向流动）
               4) 字符按距离上浮/放大/发光（--f）

               注：云朵视差 / 鼠标光晕 / 点击涟漪已统一上提到 initSiteBackground()，
                   由全站背景层承担，Hero 不再单独维护一份。
            */
            function initHeroInteraction() {
                const hero = document.getElementById('hero');
                if (!hero) return;

                const title = document.getElementById('heroTitle');
                const chars = Array.prototype.slice.call(hero.querySelectorAll('.hero-title .ch'));

                // 尊重「减少动效」偏好
                const reduce = window.matchMedia &&
                    window.matchMedia('(prefers-reduced-motion: reduce)').matches;
                const K = reduce ? 0.25 : 1;   // 全局强度系数

                // 目标值 / 平滑值
                let tnx = 0, tny = 0;          // 归一化 -1~1
                let nx = 0, ny = 0;
                let tcx = 0, tcy = 0;          // 视口坐标（算距离）
                let cx = 0, cy = 0;

                let raf = null, frame = 0, running = false;

                function cacheChars() {
                    chars.forEach(c => {
                        const r = c.getBoundingClientRect();
                        c._cx = r.left + r.width / 2;
                        c._cy = r.top + r.height / 2;
                    });
                }

                function updateChars() {
                    for (let i = 0; i < chars.length; i++) {
                        const c = chars[i];
                        if (c._cx === undefined) continue;
                        const dx = cx - c._cx, dy = cy - c._cy;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        const f = Math.max(0, 1 - dist / 220);
                        c.style.setProperty('--f', (f * f * K).toFixed(3));
                    }
                }

                function loop() {
                    if (!running) return;

                    // 平滑插值：位置跟得紧一些，倾斜跟得松一些，形成层次
                    nx += (tnx - nx) * 0.09;
                    ny += (tny - ny) * 0.09;
                    cx += (tcx - cx) * 0.16;
                    cy += (tcy - cy) * 0.16;

                    // 标题 3D 倾斜
                    if (title) {
                        title.style.transform =
                            'perspective(1100px) rotateX(' + (-ny * 7 * K).toFixed(2) + 'deg)' +
                            ' rotateY(' + (nx * 11 * K).toFixed(2) + 'deg)';
                    }

                    // 字符响应（隔帧，省开销）
                    if ((frame & 1) === 0) updateChars();

                    frame++;
                    raf = requestAnimationFrame(loop);
                }

                function start() {
                    if (running) return;
                    running = true;
                    raf = requestAnimationFrame(loop);
                }
                function stop() {
                    running = false;
                    if (raf) { cancelAnimationFrame(raf); raf = null; }
                }

                hero.addEventListener('mousemove', e => {
                    const r = hero.getBoundingClientRect();
                    tnx = ((e.clientX - r.left) / r.width  - 0.5) * 2;   // -1 ~ 1
                    tny = ((e.clientY - r.top)  / r.height - 0.5) * 2;
                    tcx = e.clientX;
                    tcy = e.clientY;
                    start();
                });

                hero.addEventListener('mouseleave', () => {
                    tnx = 0; tny = 0;
                    tcx = -9999; tcy = -9999;   // 移开后字符恢复常态
                    setTimeout(stop, 900);      // 让倾斜平滑回正后再停循环
                });

                // 尺寸变化 / 滚动后重建字符位置缓存（各自独立节流）
                let rtResize = null, rtScroll = null;
                window.addEventListener('resize', () => {
                    clearTimeout(rtResize);
                    rtResize = setTimeout(cacheChars, 200);
                });
                window.addEventListener('scroll', () => {
                    if (rtScroll) return;
                    rtScroll = setTimeout(() => { cacheChars(); rtScroll = null; }, 150);
                }, { passive: true });

                // 入场动画落定后缓存字符中心（入场过程中位置一直在变）
                setTimeout(cacheChars, 1300);
            }

            /* ========== 全站动态背景 ==========
               一层 position:fixed 的 .site-bg 贯穿整站，包含：
               1) 纸感渐变底（顶部天空蓝 → 米白 → 浅褐）
               2) 7 朵白云：drift 横移 + bob 起伏 + 跟随鼠标的景深视差
               3) 鼠标光晕：暖橙跟随光标 + 天蓝在对角反向流动
               4) 全站点击涟漪
               背景层是 fixed，所以鼠标直接用视口坐标，无需换算滚动偏移。
            */
            function initSiteBackground() {
                const bg = document.getElementById('siteBg');
                if (!bg) return;

                const clouds = Array.prototype.slice.call(bg.querySelectorAll('.cloud'));
                const inners = clouds.map(c => c.querySelector('.cloud-inner'));
                const depths = clouds.map(c => parseFloat(c.dataset.depth) || 20);

                const reduce = window.matchMedia &&
                    window.matchMedia('(prefers-reduced-motion: reduce)').matches;
                const K = reduce ? 0.25 : 1;

                let tgx = 0, tgy = 0, gx = 0, gy = 0;   // 光晕坐标（视口 px）
                let tnx = 0, tny = 0, nx = 0, ny = 0;   // 归一化 -1~1
                let tcx = 0, tcy = 0, cx = 0, cy = 0;   // 视口坐标（算距离）
                let raf = null, frame = 0, running = false, primed = false;
                let idleTimer = null;

                function updateCloudNear() {
                    for (let i = 0; i < clouds.length; i++) {
                        const r = clouds[i].getBoundingClientRect();
                        if (!r.width) continue;
                        const dx = cx - (r.left + r.width / 2);
                        const dy = cy - (r.top  + r.height / 2);
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        clouds[i].classList.toggle('near', dist < 240);
                    }
                }

                function loop() {
                    if (!running) return;

                    gx += (tgx - gx) * 0.16;
                    gy += (tgy - gy) * 0.16;
                    nx += (tnx - nx) * 0.09;
                    ny += (tny - ny) * 0.09;
                    cx += (tcx - cx) * 0.16;
                    cy += (tcy - cy) * 0.16;

                    // 云朵按景深反向视差
                    for (let i = 0; i < inners.length; i++) {
                        const d = depths[i] * K;
                        inners[i].style.transform =
                            'translate3d(' + (-nx * d).toFixed(1) + 'px,' +
                                             (-ny * d * 0.55).toFixed(1) + 'px,0)';
                    }

                    // 光晕跟随
                    bg.style.setProperty('--gx', gx.toFixed(1) + 'px');
                    bg.style.setProperty('--gy', gy.toFixed(1) + 'px');

                    // 云朵靠近提亮（低频）
                    if (frame % 10 === 0) updateCloudNear();

                    frame++;
                    raf = requestAnimationFrame(loop);
                }

                function kick() {
                    if (!running) { running = true; raf = requestAnimationFrame(loop); }
                    clearTimeout(idleTimer);
                    // 鼠标静止 1.6s 后停掉循环（插值早已收敛），省电
                    idleTimer = setTimeout(() => {
                        running = false;
                        if (raf) { cancelAnimationFrame(raf); raf = null; }
                    }, 1600);
                }

                document.addEventListener('mousemove', e => {
                    tgx = e.clientX;
                    tgy = e.clientY;
                    tnx = (e.clientX / window.innerWidth  - 0.5) * 2;
                    tny = (e.clientY / window.innerHeight - 0.5) * 2;
                    tcx = e.clientX;
                    tcy = e.clientY;

                    if (!primed) {          // 首次移动直接落位，避免光晕从中心"飞"过来
                        primed = true;
                        gx = tgx; gy = tgy; cx = tcx; cy = tcy;
                    }
                    bg.classList.add('is-live');
                    kick();
                }, { passive: true });

                // 全站点击涟漪（挂在 body 上，fixed 定位不会被背景层裁掉）
                document.addEventListener('pointerdown', e => {
                    const size = 240;
                    const el = document.createElement('span');
                    el.className = 'bg-ripple';
                    el.style.width = size + 'px';
                    el.style.height = size + 'px';
                    el.style.left = e.clientX + 'px';
                    el.style.top  = e.clientY + 'px';
                    document.body.appendChild(el);
                    setTimeout(() => el.remove(), 950);
                });

                // 首屏直接点亮光晕（不必等鼠标移动），位置取视口中上部
                gx = tgx = window.innerWidth / 2;
                gy = tgy = window.innerHeight * 0.4;
                cx = tcx = gx;
                cy = tcy = gy;
                bg.style.setProperty('--gx', gx.toFixed(1) + 'px');
                bg.style.setProperty('--gy', gy.toFixed(1) + 'px');
                setTimeout(() => bg.classList.add('is-live'), 250);

                // 窗口尺寸变化后重算光晕中心基准
                window.addEventListener('resize', () => {
                    if (!primed) {
                        tgx = window.innerWidth / 2;
                        tgy = window.innerHeight * 0.4;
                    }
                });
            }

            /* ========== 渲染亮点 ========== */
            function renderHighlights() {
                const grid = $('#highlightsGrid');
                if (!grid) return;
                grid.innerHTML = '';

                const n = resume.highlights.length;

                /* 行星系统容器 */
                const wrap = createEl('div', { class: 'orbit-wrap' });
                const ring = createEl('div', { class: 'orbit-ring' });

                const core = createEl('div', { class: 'orbit-core' });
                core.innerHTML =
                    '<div class="core-halo"></div>' +
                    '<div class="core-num">0' + n + '</div>' +
                    '<div class="core-title">核心亮点</div>' +
                    '<div class="core-en">Key Highlights</div>';

                const orbit = createEl('div', { class: 'orbit' });

                resume.highlights.forEach((h, i) => {
                    const idx = String(i + 1).padStart(2, '0');
                    const shown = (h.prefix || '') + h.value + (h.suffix || '');
                    const unit = h.unit || '';

                    // 从正上方开始，沿圆周均分
                    const angle = -90 + (360 / n) * i;
                    const slot = createEl('div', { class: 'planet-slot' });
                    slot.style.setProperty('--a', angle + 'deg');
                    slot.style.setProperty('--d', (i * 0.1).toFixed(2) + 's');

                    const inner = createEl('div', { class: 'planet-inner' });
                    const card = createEl('div', { class: 'planet-card hl-card' });

                    // 序号
                    card.appendChild(createEl('span', { class: 'hl-index', text: idx }));
                    // 分类标签
                    card.appendChild(createEl('span', { class: 'hl-tag', text: h.tag || 'HIGHLIGHT' }));

                    // 艺术数字（带镂空叠层用 data-num）
                    const num = createEl('div', { class: 'hl-num' });
                    num.setAttribute('data-num', shown + unit);
                    const pre = (h.prefix || '')
                        ? createEl('span', { class: 'sfx', text: h.prefix })
                        : null;
                    const val = createEl('span', { class: 'hl-val', text: '0' });
                    const sfx = (h.suffix || '')
                        ? createEl('span', { class: 'sfx', text: h.suffix })
                        : null;
                    if (pre) num.appendChild(pre);
                    num.appendChild(val);
                    if (sfx) num.appendChild(sfx);
                    if (unit) num.appendChild(createEl('span', { class: 'unit', text: unit }));
                    card.appendChild(num);

                    card.appendChild(createEl('div', { class: 'hl-label', text: h.label }));
                    card.appendChild(createEl('div', { class: 'hl-desc', text: h.desc }));

                    // 进度条
                    const bar = createEl('div', { class: 'hl-bar' });
                    const fill = createEl('span', {});
                    fill.style.transitionDelay = (0.25 + i * 0.09) + 's';
                    bar.appendChild(fill);
                    card.appendChild(bar);

                    // 注释
                    if (h.note) card.appendChild(createEl('div', { class: 'hl-note', text: h.note }));

                    // 锁定提示条（仅在点击锁定后浮现）
                    card.appendChild(createEl('div', {
                        class: 'hl-pick-tip',
                        text: '已锁定 · 再次点击继续公转'
                    }));

                    inner.appendChild(card);
                    slot.appendChild(inner);
                    orbit.appendChild(slot);

                    // 记录动画所需引用
                    card._val = val;
                    card._fill = fill;
                    card._target = h;
                    inner._card = card;
                });

                wrap.appendChild(ring);
                wrap.appendChild(core);
                wrap.appendChild(orbit);
                grid.appendChild(wrap);

                initHighlightsMotion();
            }

            /* 亮点区动效：入场编排 + 数字滚动 + 进度条填充 + 卡片 3D 倾斜 + 云朵视差 */
            function initHighlightsMotion() {
                const sec = document.getElementById('highlights');
                const grid = document.getElementById('highlightsGrid');
                if (!sec || !grid) return;

                const cards = Array.prototype.slice.call(grid.querySelectorAll('.hl-card'));

                const reduce = window.matchMedia &&
                    window.matchMedia('(prefers-reduced-motion: reduce)').matches;

                /* --- 数字滚动 --- */
                function countUp(card) {
                    const t = card._target;
                    const el = card._val;
                    if (!t || !el) return;
                    const to = t.value;
                    if (reduce) { el.textContent = String(to); return; }
                    const dur = 1100, t0 = performance.now();
                    (function step(now) {
                        const p = Math.min(1, (now - t0) / dur);
                        const e = 1 - Math.pow(1 - p, 3);          // easeOutCubic
                        el.textContent = String(Math.round(to * e));
                        if (p < 1) requestAnimationFrame(step);
                        else el.textContent = String(to);
                    })(t0);
                }

                /* --- 点击行星才锁定（暂停公转）；再次点击或点击空白解除 ---
                   注意：不再用 hover 暂停，否则鼠标一进入板块就不转了，
                   用户根本看不到公转效果。 */
                const orbitEl = grid.querySelector('.orbit');
                const wrapEl  = grid.querySelector('.orbit-wrap');

                function setLocked(on) {
                    if (orbitEl) orbitEl.classList.toggle('is-locked', on);
                    if (wrapEl)  wrapEl.classList.toggle('is-locked', on);
                }
                function clearPick() {
                    cards.forEach(c => c.classList.remove('is-picked'));
                    setLocked(false);
                }

                cards.forEach(card => {
                    // 可聚焦 + 键盘支持，提升可访问性
                    card.setAttribute('tabindex', '0');
                    card.setAttribute('role', 'button');
                    card.setAttribute('aria-pressed', 'false');

                    function toggle() {
                        const wasPicked = card.classList.contains('is-picked');
                        clearPick();
                        if (!wasPicked) {
                            card.classList.add('is-picked');
                            card.setAttribute('aria-pressed', 'true');
                            setLocked(true);
                        }
                    }
                    card.addEventListener('click', toggle);
                    card.addEventListener('keydown', e => {
                        if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
                            e.preventDefault();
                            toggle();
                        }
                    });
                });

                // 点击卡片以外的任意位置解除锁定
                document.addEventListener('click', e => {
                    if (!e.target.closest || !e.target.closest('.hl-card')) clearPick();
                });
                // Esc 也能解除
                document.addEventListener('keydown', e => {
                    if (e.key === 'Escape') clearPick();
                });

                /* --- 卡片 3D 倾斜（内联 transform 需带上放大，避免覆盖 CSS 的 hover/选中效果） --- */
                cards.forEach(card => {
                    card.addEventListener('mousemove', e => {
                        const r = card.getBoundingClientRect();
                        const x = (e.clientX - r.left) / r.width  - 0.5;
                        const y = (e.clientY - r.top)  / r.height - 0.5;
                        // 选中态放大更多，便于阅读
                        const s = card.classList.contains('is-picked') ? 1.15 : 1.1;
                        card.style.transitionDelay = '0s';
                        card.style.transform =
                            'perspective(820px) rotateX(' + (-y * 6).toFixed(2) + 'deg)' +
                            ' rotateY(' + (x * 8).toFixed(2) + 'deg) scale(' + s + ')';
                    });
                    card.addEventListener('mouseleave', () => {
                        card.style.transitionDelay = '0s';
                        card.style.transform = '';   // 交还给 CSS（:hover / .is-picked 自动接管）
                    });
                });

                /* 背景云朵已由全局 .site-bg 统一处理，此处不再重复监听 */

                /* --- 进入视口：行星依次入场 + 数字滚动 + 进度条填充 --- */
                const inners = Array.prototype.slice.call(grid.querySelectorAll('.planet-inner'));
                const wrap = grid.querySelector('.orbit-wrap');

                function playAll() {
                    inners.forEach((inner, i) => {
                        inner.classList.add('is-in');       // CSS 用 --d 做逐个延迟
                        const card = inner._card;
                        if (!card) return;
                        setTimeout(() => {
                            countUp(card);
                            if (card._fill) card._fill.style.width = (card._target.bar || 0) + '%';
                        }, 260 + i * 100);
                    });
                }

                // 行星一直在公转，逐个观察容易受位置影响，改为观察整个星系容器一次性触发
                if ('IntersectionObserver' in window && wrap) {
                    const io = new IntersectionObserver((entries, obs) => {
                        entries.forEach(en => {
                            if (!en.isIntersecting) return;
                            playAll();
                            obs.unobserve(en.target);
                        });
                    }, { threshold: 0.15 });
                    io.observe(wrap);
                } else {
                    playAll();
                }
            }

            /* ========== 渲染经历：3D 滑动轮播 ========== */
            function renderExperienceTabs() {
                const track = $('#experienceTrack');
                const rail  = $('#experienceRail');
                const stage = $('#experienceStage');
                if (!track || !rail || !stage) return;
                track.innerHTML = '';
                rail.innerHTML = '';

                const tabs = resume.experience.tabs;

                tabs.forEach((tabDef, i) => {
                    const d = resume.experience.data[tabDef.id] || {};
                    const idx = String(i + 1).padStart(2, '0');

                    const slide = createEl('article', { class: 'exp-slide' });
                    slide.setAttribute('role', 'group');
                    slide.setAttribute('aria-roledescription', 'slide');
                    slide.setAttribute('aria-label', (i + 1) + ' / ' + tabs.length + '：' + tabDef.label);

                    const card = createEl('div', { class: 'exp-card' });

                    /* 序号 */
                    card.appendChild(createEl('span', {
                        class: 'exp-idx',
                        text: idx + ' / ' + String(tabs.length).padStart(2, '0')
                    }));

                    /* 头部：图标 + 分类 + 时间 */
                    const head = createEl('div', { class: 'exp-head anim' });
                    head.appendChild(createEl('div', { class: 'exp-icon', text: tabDef.icon }));
                    const headTxt = createEl('div', {});
                    headTxt.appendChild(createEl('span', { class: 'exp-kicker', text: tabDef.label }));
                    headTxt.appendChild(createEl('span', { class: 'exp-period', text: d.period || d.meta || '' }));
                    head.appendChild(headTxt);
                    card.appendChild(head);

                    /* 标题 + meta */
                    card.appendChild(createEl('h3', { class: 'exp-title anim', text: d.title || '' }));
                    card.appendChild(createEl('div', { class: 'exp-meta anim', text: d.meta || '' }));

                    /* 量化数据条 */
                    if (d.stats && d.stats.length) {
                        const stats = createEl('div', { class: 'exp-stats anim' });
                        d.stats.forEach(s => {
                            const cell = createEl('div', { class: 'exp-stat' });
                            cell.appendChild(createEl('b', { text: s.k }));
                            cell.appendChild(createEl('span', { text: s.v }));
                            stats.appendChild(cell);
                        });
                        card.appendChild(stats);
                    }

                    /* 正文 */
                    card.appendChild(createEl('p', { class: 'exp-desc anim', text: d.desc || '' }));

                    // 逐个写入入场延迟，让切换时内容自上而下依次浮现
                    Array.prototype.slice.call(card.querySelectorAll('.anim'))
                        .forEach((el, k) => { el.style.transitionDelay = (0.10 + k * 0.07).toFixed(2) + 's'; });

                    slide.appendChild(card);
                    track.appendChild(slide);

                    /* 底部指示器 */
                    const dot = createEl('button', {
                        class: 'exp-dot',
                        type: 'button',
                        role: 'tab'
                    });
                    dot.appendChild(createEl('span', {
                        text: tabDef.icon + ' ' + tabDef.label
                    }));
                    dot.addEventListener('click', () => snapTo(i));
                    rail.appendChild(dot);
                });

                initExperienceCarousel(track, rail, stage);
            }

            /* ========== 轮播交互：纯鼠标位置驱动 ==========
               鼠标在 .exp-stage 内的水平位置直接映射到 active 索引，current 用 lerp 跟随，
               整条轨道围绕 current 平滑插值 → 鼠标一动，卡片就跟着动，丝滑无缝。
               离开舞台 → 平滑回中。键盘 / 指示器 / 箭头作为辅助入口。
            */
            function initExperienceCarousel(track, rail, stage) {
                const slides = Array.prototype.slice.call(track.querySelectorAll('.exp-slide'));
                const dots   = Array.prototype.slice.call(rail.querySelectorAll('.exp-dot'));
                if (!slides.length) return;
                const N = slides.length;

                const reduce = window.matchMedia &&
                    window.matchMedia('(prefers-reduced-motion: reduce)').matches;

                /* === 状态 === */
                let target  = 0;       // 浮点目标索引（0 ~ N-1）
                let current = 0;       // lerp 跟随后的值
                let raf = null, running = false;
                let pendingAnimTrigger = null;
                let lastActiveIndex = -1;

                function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

                function tick() {
                    if (!running) return;
                    const d = target - current;
                    current += d * 0.16;                  // 0.16 较跟手，0.12 更"惯性"
                    if (Math.abs(d) < 0.0008) current = target;
                    layout();
                    if (current === target) {
                        running = false; raf = null;       // 收敛即停循环
                    } else {
                        raf = requestAnimationFrame(tick);
                    }
                }
                function start() {
                    if (!running) { running = true; raf = requestAnimationFrame(tick); }
                }
                function setTarget(v) { target = clamp(v, -0.4, N - 0.6); start(); }

                function snapTo(i) { setTarget(clamp(i, 0, N - 1)); }

                /* === 布局：浮点 current 驱动，每张卡片用 i-current 算 3D 变换 === */
                function layout() {
                    const idx = Math.round(current);
                    slides.forEach((sl, i) => {
                        const off = i - current;                  // 浮点偏移
                        const abs = Math.abs(off);
                        const cap = clamp(off, -1.5, 1.5);        // 限制最远卡片

                        const x  = cap * 62;
                        const ry = cap * -34;
                        const z  = -abs * 190;
                        const sc = 1 - Math.min(abs, 1.5) * 0.14;

                        sl.style.transform =
                            'translateX(' + x.toFixed(2) + '%)' +
                            ' rotateY(' + ry.toFixed(2) + 'deg)' +
                            ' translateZ(' + z.toFixed(0) + 'px)' +
                            ' scale(' + sc.toFixed(3) + ')';
                        sl.style.opacity = abs > 1.4 ? '0' : Math.max(0.15, 1 - abs * 0.45).toFixed(2);
                        sl.style.zIndex = String(20 - Math.round(abs * 10));
                        sl.style.filter = abs > 0.5 ? 'blur(' + Math.min(2.4, abs * 1.5).toFixed(1) + 'px)' : 'none';

                        // 当前项：加 is-active 以启用橙色硬阴影高亮
                        sl.classList.toggle('is-active', i === idx);
                    });

                    /* 入场动画去抖：只有真正跨越了某个索引的"中心"才重放 */
                    if (idx !== lastActiveIndex) {
                        if (pendingAnimTrigger) clearTimeout(pendingAnimTrigger);
                        pendingAnimTrigger = setTimeout(() => {
                            if (idx === Math.round(current)) {
                                playEntry(idx);
                                lastActiveIndex = idx;
                            }
                            pendingAnimTrigger = null;
                        }, 70);
                    }
                }

                /* 重放某张卡片的入场：加 .is-entering 压回初始态，
                   隔两帧后移除，让 CSS transition 把内容"推"出来 */
                function playEntry(idx) {
                    const sl = slides[idx];
                    if (!sl) return;
                    const card = sl.querySelector('.exp-card');
                    if (!card) return;
                    card.classList.add('is-entering');
                    requestAnimationFrame(() => {
                        requestAnimationFrame(() => card.classList.remove('is-entering'));
                    });
                }

                function paintDots(idx) {
                    dots.forEach((d, i) => {
                        const on = i === idx;
                        d.classList.toggle('is-on', on);
                        d.setAttribute('aria-selected', on ? 'true' : 'false');
                    });
                }

                /* === 1) 鼠标位置驱动（仅桌面端：hover: hover） === */
                const hoverHover = window.matchMedia &&
                    window.matchMedia('(hover: hover)').matches;

                if (hoverHover) {
                    stage.addEventListener('mousemove', e => {
                        const r = stage.getBoundingClientRect();
                        const x = (e.clientX - r.left) / r.width;   // 0~1
                        setTarget(x * (N - 1));
                        // 指示器跟着当前位置走
                        paintDots(Math.round(x * (N - 1)));
                    });
                    stage.addEventListener('mouseleave', () => {
                        setTarget(0);                                // 优雅回中
                        paintDots(0);
                    });
                }

                /* === 2) 拖拽：移动端 / 触屏 fallback（也兼容触屏笔） === */
                let startX = 0, startY = 0, locked = null, startTarget = 0;

                stage.addEventListener('pointerdown', e => {
                    if (e.target.closest('.exp-nav')) return;
                    startX = e.clientX; startY = e.clientY;
                    locked = null;
                    startTarget = target;
                });
                stage.addEventListener('pointermove', e => {
                    if (!startX && !startY) return;
                    const dx = e.clientX - startX;
                    const dy = e.clientY - startY;
                    if (locked === null) {
                        if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
                        locked = Math.abs(dx) > Math.abs(dy);
                    }
                    if (!locked) return;
                    e.preventDefault();
                    const w = slides[0].getBoundingClientRect().width || 1;
                    const atEdge = (dx > 0 && current <= 0) || (dx < 0 && current >= N - 1);
                    const factor = atEdge ? 0.35 : 1;
                    const newTarget = startTarget - (dx * factor) / (w * 0.62);
                    setTarget(newTarget);
                    paintDots(Math.round(newTarget));
                });
                function endDrag() {
                    if (locked) {
                        // 松手吸附到最近的整数索引
                        snapTo(Math.round(current));
                        slides.forEach(s => s.classList.remove('is-dragging'));
                    }
                    startX = startY = 0; locked = null;
                }
                stage.addEventListener('pointerup', endDrag);
                stage.addEventListener('pointercancel', endDrag);

                /* === 3) 键盘：聚焦后 ← / → 翻页 === */
                stage.setAttribute('tabindex', '0');
                stage.addEventListener('keydown', e => {
                    if (e.key === 'ArrowRight') { e.preventDefault(); snapTo(Math.round(current) + 1); }
                    else if (e.key === 'ArrowLeft') { e.preventDefault(); snapTo(Math.round(current) - 1); }
                });

                /* === 4) 指示器 === */
                dots.forEach((d, i) => d.addEventListener('click', () => snapTo(i)));

                /* === 5) 箭头按钮（辅助入口，可选） === */
                const prevBtn = stage.querySelector('.exp-prev');
                const nextBtn = stage.querySelector('.exp-next');
                if (prevBtn) prevBtn.addEventListener('click', () => snapTo(Math.round(current) - 1));
                if (nextBtn) nextBtn.addEventListener('click', () => snapTo(Math.round(current) + 1));

                /* === 6) 减少动效偏好：去掉 transition，鼠标移动立即生效 === */
                if (reduce) {
                    slides.forEach(sl => { sl.style.transition = 'none'; });
                }

                paintDots(0);
                layout();
            }

            /* ========== 渲染项目：小树苗 + 3D 果实 + 项目内容卡 + 画中画 ==========
               果实（SVG 内，左右交叉）── 连接线 ── 项目内容卡（HTML，同侧）
               鼠标移到内容卡即展开画中画，对应果实同步高亮。 */
            function renderProjectsTabs() {
                const stage = $('#treeStage');
                const list  = $('#treeList');
                const pip   = $('#pipBox');
                if (!stage || !list) return;
                list.innerHTML = '';

                const items = resume.projects.items;

                items.forEach((it, i) => {
                    const node = createEl('article', { class: 'tree-node side-' + (it.side || 'left') });
                    // 卡片跟在果实之后浮现（果实 2.0/2.18/2.36s）
                    node.style.setProperty('--nd', (2.5 + i * 0.17).toFixed(2) + 's');
                    if (it.x) {
                        if (it.side === 'right') node.style.right = it.x;
                        else node.style.left = it.x;
                    }
                    if (it.y) node.style.top = it.y;
                    node.setAttribute('tabindex', '0');
                    node.setAttribute('role', 'button');

                    const en = createEl('div', { class: 'tn-en', text: it.en });
                    if (it.stage) en.insertBefore(createEl('span', { class: 'tn-stage', text: it.stage }), en.firstChild);
                    en.appendChild(createEl('span', { class: 'tn-cn', text: it.cn }));
                    node.appendChild(en);

                    node.appendChild(createEl('p', { class: 'tn-desc', text: it.desc }));

                    if (it.tags && it.tags.length) {
                        const tags = createEl('div', { class: 'tn-tags' });
                        it.tags.forEach(t => tags.appendChild(createEl('span', { class: 'tn-tag', text: t })));
                        node.appendChild(tags);
                    }

                    // 在线试玩按钮：新标签页打开外部链接
                    if (it.link) {
                        const btn = createEl('a', {
                            class: 'tn-btn',
                            text: it.btnText || '在线体验',
                            href: it.link,
                            target: '_blank',
                            rel: 'noopener noreferrer'
                        });
                        btn.addEventListener('click', e => e.stopPropagation()); // 不触发卡片画中画交互
                        node.appendChild(btn);
                    }

                    node._item = it;
                    node._idx = i;
                    list.appendChild(node);
                });

                const fruits = Array.prototype.slice.call(stage.querySelectorAll('.fruit'));
                fruits.forEach((f, i) => { f._item = items[i]; f._idx = i; });

                initTreeStage(stage, list, pip, fruits, items);
            }

            function initTreeStage(stage, list, pip, fruits, items) {
                const cards = Array.prototype.slice.call(list.querySelectorAll('.tree-node'));
                const pipShot = pip ? pip.querySelector('#pipShot') : null;
                const pipNum  = pip ? pip.querySelector('#pipNum')  : null;
                const pipName = pip ? pip.querySelector('#pipName') : null;

                /* --- 进入视口：整棵树由下往上生长，最后果实弹出 --- */
                if ('IntersectionObserver' in window) {
                    const io = new IntersectionObserver((entries, obs) => {
                        entries.forEach(en => {
                            if (en.isIntersecting) {
                                stage.classList.add('is-in');
                                obs.unobserve(en.target);
                            }
                        });
                    }, { threshold: 0.15 });
                    io.observe(stage);
                } else {
                    stage.classList.add('is-in');
                }
                setTimeout(() => stage.classList.add('is-in'), 3000);   /* 兜底 */

                /* --- 画中画跟随光标 --- */
                let tx = 0, ty = 0, x = 0, y = 0, raf = null, running = false;
                let scaleTo = 0.85, scaleNow = 0.85;
                function pipLoop() {
                    if (!running) return;
                    x += (tx - x) * 0.18;
                    y += (ty - y) * 0.18;
                    scaleNow += (scaleTo - scaleNow) * 0.18;
                    if (pip) {
                        pip.style.transform =
                            'translate3d(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px,0) scale(' + scaleNow.toFixed(3) + ')';
                    }
                    if (Math.abs(tx - x) > 0.3 || Math.abs(ty - y) > 0.3 || Math.abs(scaleTo - scaleNow) > 0.002) {
                        raf = requestAnimationFrame(pipLoop);
                    } else { running = false; raf = null; }
                }
                function pipKick() { if (!running) { running = true; raf = requestAnimationFrame(pipLoop); } }
                function placePip(cx, cy) {
                    if (!pip) return;
                    const w = pip.offsetWidth || 320;
                    const h = pip.offsetHeight || 260;
                    let px = cx + 26, py = cy + 18;
                    if (px + w > window.innerWidth - 12)  px = cx - w - 26;
                    if (py + h > window.innerHeight - 12) py = cy - h - 18;
                    tx = Math.max(12, px);
                    ty = Math.max(12, py);
                    pipKick();
                }

                function showPip(it, snap) {
                    if (!pip || !it) return;
                    if (pipNum)  pipNum.textContent  = it.num || '';
                    if (pipName) pipName.textContent = it.en || '';
                    if (pipShot) {
                        if (it.img) {
                            pipShot.innerHTML = '';
                            const img = document.createElement('img');
                            img.src = it.img;
                            img.alt = (it.en || '项目') + ' 截图';
                            pipShot.appendChild(img);
                        } else {
                            pipShot.innerHTML =
                                '<div class="pip-empty">' +
                                '<span class="ico">🖼</span>' +
                                '<span class="txt">项目截图待上传</span>' +
                                '</div>';
                        }
                    }
                    if (snap) { x = tx; y = ty; }
                    pip.classList.add('is-on');
                    scaleTo = 1;
                }
                function hidePip() {
                    if (!pip) return;
                    pip.classList.remove('is-on');
                    scaleTo = 0.85;
                    pipKick();
                }

                /* --- 焦点联动：卡片与果实同时高亮 --- */
                function setActive(idx, snap, cx, cy) {
                    cards.forEach(c => c.classList.toggle('is-on', c._idx === idx));
                    fruits.forEach(f => f.classList.toggle('is-on', f._idx === idx));
                    const it = items[idx];
                    showPip(it, snap);
                    placePip(cx != null ? cx : (window._lastCX || window.innerWidth / 2),
                             cy != null ? cy : (window._lastCY || window.innerHeight / 2));
                }
                function clearActive() {
                    cards.forEach(c => c.classList.remove('is-on'));
                    fruits.forEach(f => f.classList.remove('is-on'));
                    hidePip();
                }

                const hoverHover = window.matchMedia &&
                    window.matchMedia('(hover: hover)').matches;

                // 内容卡：hover / focus 展开画中画（主要入口）
                cards.forEach(card => {
                    const idx = card._idx;
                    if (hoverHover) {
                        card.addEventListener('mouseenter', () => {
                            const wasOff = !pip.classList.contains('is-on');
                            setActive(idx, wasOff);
                        });
                        card.addEventListener('mouseleave', clearActive);
                    } else {
                        card.addEventListener('click', () => {
                            if (card.classList.contains('is-on')) clearActive();
                            else setActive(idx, true);
                        });
                    }
                    card.addEventListener('focus', () => {
                        const r = card.getBoundingClientRect();
                        setActive(idx, true, r.right, r.top);
                    });
                    card.addEventListener('blur', clearActive);
                });

                // 果实：hover 也能展开（并点亮对应卡片）
                fruits.forEach(fruit => {
                    const idx = fruit._idx;
                    if (hoverHover) {
                        fruit.addEventListener('mouseenter', () => {
                            const wasOff = !pip.classList.contains('is-on');
                            setActive(idx, wasOff);
                        });
                        fruit.addEventListener('mouseleave', clearActive);
                    } else {
                        fruit.addEventListener('click', () => {
                            if (fruit.classList.contains('is-on')) clearActive();
                            else setActive(idx, true);
                        });
                    }
                });

                if (hoverHover) {
                    document.addEventListener('mousemove', e => {
                        window._lastCX = e.clientX;
                        window._lastCY = e.clientY;
                        if (pip && pip.classList.contains('is-on')) placePip(e.clientX, e.clientY);
                    }, { passive: true });
                    window.addEventListener('scroll', () => {
                        if (pip && pip.classList.contains('is-on')) {
                            placePip(window._lastCX || 0, window._lastCY || 0);
                        }
                    }, { passive: true });
                    document.addEventListener('keydown', e => {
                        if (e.key === 'Escape') clearActive();
                    });
                }
            }

            /* ========== Tabs 通用逻辑 ========== */
            function activateTab(tabList, clickedBtn, panelId) {
                const allBtns = $$('.tab-btn', tabList);
                const allPanels = $$('.tab-panel', tabList.parentElement);
                allBtns.forEach(b => {
                    const isTarget = b === clickedBtn;
                    b.setAttribute('aria-selected', isTarget ? 'true' : 'false');
                    b.tabIndex = isTarget ? 0 : -1;
                });
                allPanels.forEach(p => {
                    const isTarget = p.id === panelId;
                    p.setAttribute('aria-hidden', isTarget ? 'false' : 'true');
                    p.style.display = isTarget ? 'block' : 'none';
                    if (isTarget) {
                        p.style.animation = 'fadeInUp 0.25s ease both';
                    }
                });
            }

            function handleTabKeydown(e, tabList, currentIndex) {
                const btns = $$('.tab-btn', tabList);
                if (btns.length === 0) return;
                let newIndex = -1;
                if (e.key === 'ArrowRight') {
                    e.preventDefault();
                    newIndex = (currentIndex + 1) % btns.length;
                } else if (e.key === 'ArrowLeft') {
                    e.preventDefault();
                    newIndex = (currentIndex - 1 + btns.length) % btns.length;
                } else if (e.key === 'Home') {
                    e.preventDefault();
                    newIndex = 0;
                } else if (e.key === 'End') {
                    e.preventDefault();
                    newIndex = btns.length - 1;
                } else if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    btns[currentIndex].click();
                    return;
                }
                if (newIndex >= 0) {
                    btns[newIndex].focus();
                    btns[newIndex].click();
                }
            }

            /* ========== 渲染技能 ========== */
            function renderSkills() {
                const grid = $('#skillsGrid');
                if (!grid) return;
                grid.innerHTML = '';
                resume.skills.categories.forEach(cat => {
                    const catDiv = createEl('div', { class: 'skill-category' });
                    const titleDiv = createEl('div', { class: 'skill-category-title' });
                    const iconSpan = createEl('span', { class: 'icon', text: cat.icon });
                    titleDiv.appendChild(iconSpan);
                    titleDiv.appendChild(createEl('span', { text: cat.name }));
                    catDiv.appendChild(titleDiv);

                    cat.bars.forEach(bar => {
                        const barDiv = createEl('div', { class: 'skill-bar' });
                        const labelDiv = createEl('div', { class: 'skill-bar-label' });
                        labelDiv.appendChild(createEl('span', { text: bar.label }));
                        const numSpan = createEl('span', { text: '0%' });
                        numSpan.dataset.target = bar.level;
                        labelDiv.appendChild(numSpan);
                        barDiv.appendChild(labelDiv);
                        const track = createEl('div', { class: 'skill-bar-track' });
                        const fill = createEl('div', {
                            class: 'skill-bar-fill' + (bar.level >= 85 ? ' highlight' : ''),
                            style: 'width:0%'
                        });
                        fill.dataset.target = bar.level;
                        track.appendChild(fill);
                        barDiv.appendChild(track);
                        catDiv.appendChild(barDiv);
                    });

                    if (cat.tags && cat.tags.length > 0) {
                        const tagsDiv = createEl('div', { class: 'skill-tags' });
                        cat.tags.forEach(t => {
                            tagsDiv.appendChild(createEl('span', { class: 'badge', text: t }));
                        });
                        catDiv.appendChild(tagsDiv);
                    }

                    grid.appendChild(catDiv);
                });

                /* 入场动效：板块进入视口后，进度条推满 + 百分比数字滚动 */
                const fills  = grid.querySelectorAll('.skill-bar-fill');
                const numEls = grid.querySelectorAll('.skill-bar-label span:last-child');
                let played = false;
                const play = () => {
                    if (played) return;
                    played = true;
                    fills.forEach(f => { f.style.width = f.dataset.target + '%'; });
                    const t0 = performance.now(), dur = 1100;
                    const tick = now => {
                        const p = Math.min(1, (now - t0) / dur);
                        const ease = 1 - Math.pow(1 - p, 3);
                        numEls.forEach(n => {
                            n.textContent = Math.round(n.dataset.target * ease) + '%';
                        });
                        if (p < 1) requestAnimationFrame(tick);
                    };
                    requestAnimationFrame(tick);
                };
                if ('IntersectionObserver' in window) {
                    const io = new IntersectionObserver((entries, obs) => {
                        entries.forEach(en => {
                            if (en.isIntersecting) { play(); obs.unobserve(en.target); }
                        });
                    }, { threshold: 0.2 });
                    io.observe(grid);
                    setTimeout(play, 2500);   /* 兜底：确保数据最终可见 */
                } else {
                    play();
                }
            }

            /* ========== 导航栏滚动效果 ========== */
            function initNavbarScroll() {
                const navbar = $('#navbar');
                const backToTop = $('#backToTop');
                if (!navbar || !backToTop) return;

                let ticking = false;
                function updateScrollState() {
                    const scrollY = window.scrollY;
                    if (scrollY > 40) {
                        navbar.classList.add('scrolled');
                    } else {
                        navbar.classList.remove('scrolled');
                    }
                    if (scrollY > 300) {
                        backToTop.classList.add('visible');
                    } else {
                        backToTop.classList.remove('visible');
                    }
                    ticking = false;
                }

                window.addEventListener('scroll', () => {
                    if (!ticking) {
                        requestAnimationFrame(updateScrollState);
                        ticking = true;
                    }
                }, { passive: true });
                updateScrollState();

                backToTop.addEventListener('click', () => {
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                });
            }

            /* ========== 汉堡菜单 ========== */
            function initHamburger() {
                const btn = $('#hamburgerBtn');
                const links = $('#navbarLinks');
                if (!btn || !links) return;

                btn.addEventListener('click', () => {
                    const isOpen = links.classList.toggle('open');
                    btn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
                });

                links.addEventListener('click', (e) => {
                    if (e.target.tagName === 'A' && links.classList.contains('open')) {
                        links.classList.remove('open');
                        btn.setAttribute('aria-expanded', 'false');
                    }
                });

                document.addEventListener('click', (e) => {
                    if (!e.target.closest('.navbar') && links.classList.contains('open')) {
                        links.classList.remove('open');
                        btn.setAttribute('aria-expanded', 'false');
                    }
                });
            }

            /* ========== 初始化主题 ========== */
            function initTheme() {
                const saved = (() => { try { return localStorage.getItem('resume-theme'); } catch (e) { return null; } })();
                if (saved === 'dark' || saved === 'light') {
                    setTheme(saved);
                } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    setTheme('dark');
                } else {
                    setTheme('light');
                }

                const toggleBtn = $('#themeToggle');
                if (toggleBtn) {
                    toggleBtn.addEventListener('click', toggleTheme);
                }

                if (window.matchMedia) {
                    const mq = window.matchMedia('(prefers-color-scheme: dark)');
                    mq.addEventListener && mq.addEventListener('change', (e) => {
                        const current = getTheme();
                        const saved = (() => { try { return localStorage.getItem('resume-theme'); } catch (e) { return null; } })();
                        if (!saved) {
                            setTheme(e.matches ? 'dark' : 'light');
                        }
                    });
                }
            }

            /* ========== 打印按钮 ========== */
            function initPrint() {
                const btn = $('#printBtn');
                if (btn) {
                    btn.addEventListener('click', () => {
                        window.print();
                    });
                }
            }

            /* ========== 初始化所有 ========== */
            function init() {
                initTheme();
                initSiteBackground();   // 全站动态背景最先启用
                renderHero();
                renderHighlights();
                renderExperienceTabs();
                renderProjectsTabs();
                renderSkills();
                renderEduCert();
                renderFooter();
                initNavbarScroll();
                initHamburger();
                initPrint();

                console.log('✅ 简历网站渲染完成 — 何杬 | 日拱一卒，功不唐捐');
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
</body>
</html>
